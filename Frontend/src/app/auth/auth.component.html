<div class="auth-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Iniciar Sesión</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <!-- Mensaje de sesión expirada -->
      <div *ngIf="sessionExpired" class="session-expired-alert">
        <mat-icon>access_time</mat-icon>
        <div class="session-expired-message">
          <strong>Tu sesión ha expirado</strong>
          <p>Por favor, inicia sesión nuevamente para continuar.</p>
        </div>
      </div>

      <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
        <!-- Usuario -->
        <mat-form-field appearance="outline">
          <mat-label>Nombre de usuario</mat-label>
          <input matInput formControlName="username" placeholder="Ingresa tu nombre de usuario" />
          <mat-icon matSuffix>account_circle</mat-icon>
          <mat-error *ngIf="authForm.get('username')?.invalid && authForm.get('username')?.touched">
            El nombre de usuario es obligatorio.
          </mat-error>
        </mat-form-field>

        <!-- Contraseña -->
        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password" placeholder="Ingresa tu contraseña" />
          <mat-icon matSuffix>lock</mat-icon>
          <mat-error *ngIf="authForm.get('password')?.invalid && authForm.get('password')?.touched">
            La contraseña es obligatoria.
          </mat-error>
        </mat-form-field>

        <!-- Mensaje de Error -->
        <div *ngIf="loginError" class="error-message">
          {{ loginError }}
        </div>

        <!-- Botón Enviar -->
        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="authForm.invalid">
            <mat-icon>login</mat-icon>
            Iniciar Sesión
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
