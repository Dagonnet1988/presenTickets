<div class="profile-container">
  <h1>Perfil de Usuario</h1>
  <form *ngIf="user">
    <div class="form-group">
      <label for="name">Nombre</label>
      <input type="text" id="name" name="name" class="form-control" [(ngModel)]="user.name" [readonly]="!isEditing">
    </div>
    <div class="form-group">
      <label for="email">Correo</label>
      <input type="email" id="email" name="email" class="form-control" [(ngModel)]="user.email" [readonly]="!isEditing">
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" class="form-control" [(ngModel)]="user.password" [readonly]="!isEditing">
    </div>
    <div class="form-group">
      <label for="phone">Teléfono</label>
      <input type="tel" id="phone" name="phone" class="form-control" [(ngModel)]="user.phone" [readonly]="!isEditing">
    </div>
    <div class="form-group">
      <label for="position">Cargo</label>
      <input type="text" id="position" name="position" class="form-control" [(ngModel)]="user.position" [readonly]="!isEditing">
    </div>
    <div class="form-group">
      <label for="area">Área</label>
      <input type="text" id="area" name="area" class="form-control" [(ngModel)]="user.area" [readonly]="!isEditing">
    </div>
    <button type="button" class="btn btn-primary" (click)="toggleEdit()">{{ isEditing ? 'Guardar Cambios' : 'Editar' }}</button>
  </form>
</div>
