<div class="notifications-container">
  <h2 class="notification-title">
    <mat-icon>notifications</mat-icon>
    Notificaciones
  </h2>

  <ng-container *ngIf="notifications && notifications.length > 0; else emptyNotifications">
    <div *ngFor="let notification of notifications" class="notification-card">
      <div class="notification-content">
        <div class="notification-info">
          <div class="notification-type">{{ notification.type | notificationType }}</div>
          <div class="notification-message">
            {{ notification.data.title || notification.data.message || notification.data.status }}
          </div>
          <div class="notification-time" *ngIf="notification.timestamp">
            <mat-icon>access_time</mat-icon>
            {{ notification.timestamp | date:'short' }}
          </div>
        </div>
        <div class="notification-actions">
          <button mat-raised-button class="view-button" (click)="goToTicket(notification.data.ticketId || notification.data.id)">
            <mat-icon>visibility</mat-icon>
            Ver Ticket
          </button>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-template #emptyNotifications>
    <div class="empty-notifications">
      <mat-icon>notifications_off</mat-icon>
      <h3>No hay notificaciones</h3>
      <p>No tienes notificaciones por el momento.</p>
    </div>
  </ng-template>
</div>
