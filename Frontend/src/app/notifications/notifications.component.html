<div class="notifications-container">
  <h2>Notificaciones</h2>
  <mat-list>
    <mat-list-item *ngFor="let notification of notifications">
      <div mat-line>
        <strong>{{ notification.type | notificationType }}</strong>:
        {{ notification.data.title || notification.data.message || notification.data.status }}
        <span *ngIf="notification.timestamp">- {{ notification.timestamp | date:'short' }}</span>
      </div>
      <button mat-button (click)="goToTicket(notification.data.ticketId || notification.data.id)">
        Ver Ticket
      </button>
    </mat-list-item>
  </mat-list>
</div>
