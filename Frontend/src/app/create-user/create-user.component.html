<div class="form-container mat-elevation-z4">
  <h2 class="form-title">👤 Crear Nuevo Usuario</h2>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="user-form">
    <div class="form-grid">
      <!-- Campos del formulario -->
      <mat-form-field appearance="outline">
        <mat-label>Usuario *</mat-label>
        <input matInput formControlName="username" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Rol *</mat-label>
        <mat-select formControlName="role">
          <mat-option *ngFor="let role of roles" [value]="role.value">
            {{ role.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="firstname" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Apellido</mat-label>
        <input matInput formControlName="lastname" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Correo electrónico</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Teléfono</mat-label>
        <input matInput formControlName="phone" />
      </mat-form-field>
    </div>

    <div class="form-actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="userForm.invalid">
        Crear Usuario
      </button>
    </div>
  </form>

  <hr />

  <!-- Cargar archivo -->
  <div>
    <h3>Cargar usuarios desde archivo</h3>
    <input type="file" (change)="onFileSelected($event)" accept=".txt, .csv" />
    <button mat-raised-button color="accent" (click)="processFile()">Procesar Archivo</button>
    <button mat-raised-button color="primary" (click)="downloadTemplate()">Descargar Plantilla</button>
  </div>
</div>
