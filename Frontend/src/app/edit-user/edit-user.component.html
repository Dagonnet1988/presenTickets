<div class="form-container" *ngIf="userForm">
  <div class="form-header">
    <h2 class="form-title">
      <mat-icon>edit_note</mat-icon>
      Editar Usuario
    </h2>
  </div>

  <div class="form-content">
    <form [formGroup]="userForm" (ngSubmit)="saveChanges()">
      <div class="form-field">
        <mat-form-field appearance="outline">
          <mat-label>Identificador</mat-label>
          <input matInput formControlName="username" required />
          <mat-icon matSuffix>account_circle</mat-icon>
        </mat-form-field>
      </div>

      <div class="form-field" *ngIf="userRole === 'admin'">
        <mat-form-field appearance="outline">
          <mat-label>Rol</mat-label>
          <mat-select formControlName="role" required>
            <mat-option value="user">Usuario</mat-option>
            <mat-option value="tech">Técnico</mat-option>
          </mat-select>
          <mat-icon matSuffix>admin_panel_settings</mat-icon>
        </mat-form-field>
      </div>

      <div class="form-field">
        <mat-form-field appearance="outline">
          <mat-label>Correo</mat-label>
          <input matInput type="email" formControlName="email" />
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>
      </div>

      <div class="form-field">
        <mat-form-field appearance="outline">
          <mat-label>Nombres</mat-label>
          <input matInput formControlName="firstname" />
          <mat-icon matSuffix>badge</mat-icon>
        </mat-form-field>
      </div>

      <div class="form-field">
        <mat-form-field appearance="outline">
          <mat-label>Apellidos</mat-label>
          <input matInput formControlName="lastname" />
          <mat-icon matSuffix>badge</mat-icon>
        </mat-form-field>
      </div>

      <div class="form-field">
        <mat-form-field appearance="outline">
          <mat-label>Teléfono</mat-label>
          <input matInput formControlName="phone" />
          <mat-icon matSuffix>phone</mat-icon>
        </mat-form-field>
      </div>

      <div class="form-field">
        <mat-form-field appearance="outline">
          <mat-label>Creado el</mat-label>
          <input matInput formControlName="created_at" [value]="userForm.get('created_at')?.value | date : 'd MMMM y, h:mm a'" readonly />
          <mat-icon matSuffix>event</mat-icon>
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button mat-flat-button type="submit" [disabled]="userForm.invalid" class="action-button save-button">
          <mat-icon>save</mat-icon>
          Guardar Cambios
        </button>

        <button mat-flat-button type="button" routerLink="/admin" class="action-button cancel-button">
          <mat-icon>arrow_back</mat-icon>
          Volver
        </button>
      </div>
    </form>
  </div>
</div>
