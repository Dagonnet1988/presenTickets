# PresenTickets - Configuración nginx de producción
# Servidor: 192.162.2.5 (Ubuntu, nginx 1.24.0)
# Ruta en el servidor: /etc/nginx/sites-enabled/default
#
# Actualizado: 2026-09-11
#
# NOTA IMPORTANTE sobre despliegues:
#   nginx incluye TODO archivo que esté dentro de /etc/nginx/sites-enabled/,
#   sin filtrar por nombre. Si vas a dejar un backup del config ahí, NO lo
#   dejes en esa carpeta (nginx lo carga como servidor adicional y genera
#   "conflicting server name" + comportamiento impredecible). Backups van en
#   /root/nginx-backups/ en el servidor, o en /etc/nginx/sites-available/
#   con otro nombre (esa carpeta si se puede usar para "no activos", pero aun
#   así lo más seguro es fuera del árbol de nginx).
#
# Por qué los `location` de assets e index.html llevan su propio bloque de
# `add_header` de seguridad (X-Frame-Options, etc.): en nginx, si un location
# define su propio add_header, deja de heredar los del server{} padre. Hay que
# repetirlos en cada location que use add_header para no perderlos.
#
# Cache-Control (agregado tras el deploy de fases 1-9, sep/2026): antes no
# había Cache-Control ni distinción entre index.html y los bundles con hash.
# Un `index.html` viejo cacheado por el navegador pedía un bundle .js que ya
# no existía, y `try_files $uri /index.html;` respondía con el HTML en vez de
# 404 -> el navegador esperaba JS y recibía HTML -> pantalla en blanco tras
# cada deploy. Se corrigió separando:
#   - index.html / rutas SPA: Cache-Control no-cache (siempre revalida)
#   - assets con hash (main-XXXX.js, styles-XXXX.css, etc.): cache largo +
#     `try_files $uri =404;` (un asset faltante da 404 real, no index.html)

server {
    listen 80;
    server_name 192.162.2.5;

    # ========================
    # PRODUCCIÓN - / (frontend)
    # ========================
    root /var/www/html;
    index index.html;
    server_name _;

    # Assets con nombre hasheado por Angular (main-XXXX.js, styles-XXXX.css, etc.):
    # cache agresivo del navegador, y si no existen (build viejo cacheado) 404 real
    # en vez de servir index.html — así el navegador se entera de que debe recargar
    # en lugar de intentar ejecutar HTML como si fuera JavaScript.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        access_log off;
    }

    # index.html y rutas de la SPA: nunca cachear, siempre pedir la última versión
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
    }

	# ========================
	# PRUEBAS - /pruebas/
	# ========================
	location /pruebas/ {
		alias /var/www/html-pruebas/;
		index index.html;
		try_files $uri $uri/ /pruebas/index.html;
	}



    # =============
    # API (producción)
    # =============
    location /api/ {
        proxy_pass http://localhost:3000; # Backend producción
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket para Socket.IO
    location /socket.io/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos ocultos
    location ~ /\. {
        deny all;
    }

    # Archivos estáticos subidos
    location /uploads/ {
        proxy_pass http://localhost:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
